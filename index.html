<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5e9f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Paint by Numbers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* ---- Paint by Numbers · a tiny open-source painting game for little artists ---- */
  :root{
    --bg1:#fbeef7;   /* page background top    */
    --bg2:#eae2f6;   /* page background bottom */
    --ink:#6e5a79;   /* soft plum text         */
    --card:#ffffff;
    --ring:#f18fbf;  /* selection ring pink    */
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:"Baloo 2","Comic Sans MS","Segoe UI Rounded","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---------- top bar ---------- */
  header{
    display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top) + 8px) 14px 6px;
    flex:0 0 auto;
  }
  header h1{
    font-size:clamp(18px,4.5vw,28px); margin:0; font-weight:800; letter-spacing:.5px;
    display:flex; align-items:center; gap:8px;
  }
  header .spacer{ flex:1 1 auto; }
  .iconbtn{
    border:none; background:var(--card); color:var(--ink);
    width:46px; height:46px; border-radius:16px; font-size:22px;
    box-shadow:0 3px 0 rgba(110,90,121,.18); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(110,90,121,.18); }

  /* ---------- progress bar ---------- */
  #progress{ display:flex; align-items:center; gap:6px; padding:0 16px 4px; flex:0 0 auto; height:18px; }
  #progressBar{ flex:1 1 auto; height:12px; border-radius:99px; background:#ffffffaa; overflow:hidden; box-shadow:inset 0 1px 2px rgba(110,90,121,.15); }
  #progressFill{ height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#ffd36e,#f18fbf,#a8e6cf); transition:width .25s ease; }

  /* ---------- canvas stage ---------- */
  #stage{ flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:6px 10px; min-height:0; }
  #board{ touch-action:none; border-radius:20px; box-shadow:0 8px 24px rgba(110,90,121,.20); background:#fff; }

  /* ---------- palette ---------- */
  #palette{
    flex:0 0 auto; display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);
  }
  .swatch{
    position:relative; border:none; cursor:pointer;
    width:52px; height:60px; border-radius:16px; padding:0;
    background:transparent; display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease;
  }
  .swatch .chip{
    width:48px; height:48px; border-radius:15px;
    box-shadow:0 3px 0 rgba(110,90,121,.18), inset 0 0 0 3px #ffffffcc;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:20px;
  }
  .swatch.sel{ transform:translateY(-8px) scale(1.06); }
  .swatch.sel .chip{ box-shadow:0 0 0 4px var(--ring), 0 5px 0 rgba(110,90,121,.18), inset 0 0 0 3px #ffffffcc; }
  .swatch .done{
    position:absolute; top:-4px; right:-2px; width:24px; height:24px; border-radius:50%;
    background:#7cd6a6; color:#fff; font-size:15px; display:none; align-items:center; justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .swatch.complete .done{ display:flex; }
  .swatch.complete .chip{ opacity:.45; }

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(78,63,90,.34); backdrop-filter:blur(3px); z-index:20; padding:20px;
  }
  .overlay.show{ display:flex; }
  .panel{
    background:var(--card); border-radius:28px; padding:24px 22px 26px; text-align:center;
    max-width:520px; width:100%; max-height:92vh; overflow-y:auto;
    box-shadow:0 18px 50px rgba(78,63,90,.35);
    animation:pop .32s cubic-bezier(.2,1.3,.4,1) both;
  }
  @keyframes pop{ from{ transform:scale(.85); opacity:0 } to{ transform:scale(1); opacity:1 } }
  .panel h2{ margin:.15em 0 .05em; font-size:clamp(24px,6vw,34px); font-weight:800; }
  .panel p{ margin:.2em 0 1em; opacity:.75; font-size:16px; }
  .subtitle{ opacity:.7; font-weight:700; font-size:15px; margin:0 0 14px; }
  .bigbtn{
    border:none; cursor:pointer; font-family:inherit; font-weight:800;
    font-size:21px; color:#fff; padding:15px 28px; border-radius:20px;
    background:linear-gradient(180deg,#ff9ecb,#f36ea8);
    box-shadow:0 5px 0 #d94e8b; margin:6px;
  }
  .bigbtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #d94e8b; }
  .bigbtn.ghost{ background:linear-gradient(180deg,#eae2f6,#d9cdec); color:var(--ink); box-shadow:0 5px 0 #b9a9cf; }
  .bigbtn.ghost:active{ box-shadow:0 2px 0 #b9a9cf; }

  /* ---------- character gallery ---------- */
  #galleryGrid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:12px; margin-top:6px;
  }
  .pick{
    position:relative; border:none; cursor:pointer; background:#f6f0fb;
    border-radius:18px; padding:8px 6px 6px; display:flex; flex-direction:column; align-items:center; gap:4px;
    box-shadow:0 3px 0 rgba(110,90,121,.14); transition:transform .12s ease;
  }
  .pick:active{ transform:translateY(2px); }
  .pick canvas{ image-rendering:pixelated; width:80px; height:80px; border-radius:12px; background:#eae2f6; }
  .pick .plabel{ font-weight:800; font-size:14px; }
  .pick .star{
    position:absolute; top:2px; right:4px; font-size:18px; display:none;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));
  }
  .pick.done .star{ display:block; }

  /* ---------- discreet, grown-ups-only support link ---------- */
  .supportLink{
    margin-top:16px; border:none; background:transparent; cursor:pointer;
    color:#b79ecf; font-family:inherit; font-weight:700; font-size:14px;
    text-decoration:underline; text-underline-offset:3px;
  }
  .supportLink:active{ color:#8f76b0; }
  #gateInput{
    font-family:inherit; font-size:26px; font-weight:800; text-align:center;
    width:130px; padding:10px; border-radius:14px; border:3px solid #e6dbf5;
    color:#6e5a79; outline:none; user-select:auto; -webkit-user-select:auto;
  }
  #gateInput:focus{ border-color:#f18fbf; }
  #gateErr{ color:#d94e8b; font-weight:700; min-height:1.2em; margin:.4em 0 0; }

  /* confetti sits above everything but ignores taps */
  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:30; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span>🎨</span><span>Paint by Numbers</span></h1>
    <span class="spacer"></span>
    <button class="iconbtn" id="homeBtn" title="Pick a picture">🏠</button>
    <button class="iconbtn" id="zoomBtn" title="Zoom in">🔍</button>
    <button class="iconbtn" id="soundBtn" title="Sound">🔊</button>
    <button class="iconbtn" id="resetBtn" title="Start over">↺</button>
  </header>

  <div id="progress">
    <div id="progressBar"><div id="progressFill"></div></div>
    <span id="progressPct" style="font-weight:800;min-width:44px;text-align:right">0%</span>
  </div>

  <div id="stage"><canvas id="board"></canvas></div>

  <div id="palette"></div>
</div>

<!-- Character picker (also the start screen) -->
<div class="overlay show" id="gallery">
  <div class="panel">
    <h2>Paint by Numbers</h2>
    <div class="subtitle">for little artists 🐾 — pick a picture!</div>
    <div id="galleryGrid"></div>
    <button class="supportLink" id="supportBtn">♥ Support this free app</button>
  </div>
</div>

<!-- Parental gate (grown-ups only) before opening the donate page -->
<div class="overlay" id="gate">
  <div class="panel">
    <h2>Ask a grown-up 🧑</h2>
    <p>This opens a page to support the app. To continue, solve this:</p>
    <p style="font-size:26px;font-weight:800;margin:.2em 0" id="gateQ">7 × 8 = ?</p>
    <input id="gateInput" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="answer">
    <div id="gateErr"></div>
    <div>
      <button class="bigbtn" id="gateOk">Open</button>
      <button class="bigbtn ghost" id="gateCancel">Back</button>
    </div>
  </div>
</div>

<!-- Start-over confirm -->
<div class="overlay" id="confirm">
  <div class="panel">
    <h2>Start over?</h2>
    <p>This will clear your painting.</p>
    <button class="bigbtn" id="confirmYes">Yes</button>
    <button class="bigbtn ghost" id="confirmNo">No</button>
  </div>
</div>

<!-- Win -->
<div class="overlay" id="win">
  <div class="panel">
    <h2>You did it! 🎉</h2>
    <p id="winMsg">It looks wonderful!</p>
    <button class="bigbtn" id="againBtn">Paint Again</button>
    <button class="bigbtn ghost" id="pickBtn">Pick Another 🖼️</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script src="characters.js"></script>
<script>
/* ============================================================================
   Paint by Numbers — open-source, offline, no dependencies.
   Character art lives in characters.js (window.CHARACTERS), authored with the
   friendly drawing primitives in tools/gen.js. Each character:
     { id, name, bg, palette:{ number -> {hex,name} }, grid:[[numbers]] }
   grid value 0 = background (not painted). Run `node tools/gen.js` to rebuild.
   ========================================================================== */
const CHARACTERS = window.CHARACTERS || [];
const SAVE_PREFIX = 'pbn36.';               // bump if the grids ever change shape
const SUPPORT_URL = 'https://buymeacoffee.com/temperaturezero';   // <-- your donate page (edit this one line)

/* ----- state (all rebuilt when a character is chosen) -------------------- */
let CHAR=null, ROWS=0, COLS=0, filled=[], pop=[], shake=[];
let numbers=[], swatches={};
let selected=0, paintedCount=0, paintableTotal=0, won=false, soundOn=true;
let cell=24, ox=0, oy=0;
/* viewport: the canvas is a fixed window onto the picture. At zoom 1 the whole
   picture fits it exactly; zooming in makes the cells finger-sized (the 72x72
   characters need this — at fit their cells are ~11px). */
let vw=0, vh=0, fitCell=24, zoom=1, panTarget=null;
const ZOOM_STEPS = [1, 2, 3.2], ZOOM_MAX = 8;

/* ----- elements ---------------------------------------------------------- */
const board = document.getElementById('board');
const ctx = board.getContext('2d');
const confetti = document.getElementById('confetti');
const cctx = confetti.getContext('2d');
const paletteEl = document.getElementById('palette');
const progressFill = document.getElementById('progressFill');
const progressPct = document.getElementById('progressPct');
const galleryEl = document.getElementById('gallery');
const galleryGrid = document.getElementById('galleryGrid');

/* ----- colour helpers ---------------------------------------------------- */
function rgb(hex){ const n=parseInt(hex.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function luminance(hex){ const [r,g,b]=rgb(hex); return (0.299*r+0.587*g+0.114*b)/255; }
function textOn(hex){ return luminance(hex) > 0.62 ? '#6e5a79' : '#fff8fc'; }

/* ----- per-character saved progress -------------------------------------- */
function saveKey(){ return SAVE_PREFIX + CHAR.id; }
function saveProgress(){
  if (!CHAR) return;
  try { localStorage.setItem(saveKey(), JSON.stringify(filled.flat())); } catch(_){}
}
function loadSaved(ch){
  try {
    const raw = localStorage.getItem(SAVE_PREFIX + ch.id);
    if (!raw) return null;
    const flat = JSON.parse(raw);
    if (!Array.isArray(flat) || flat.length !== ch.grid.length*ch.grid[0].length) return null;
    return flat;
  } catch(_){ return null; }
}
function clearSaved(){ try { localStorage.removeItem(saveKey()); } catch(_){} }
function isComplete(ch){
  const flat = loadSaved(ch); if (!flat) return false;
  let need=0, have=0, i=0;
  for (let r=0;r<ch.grid.length;r++) for (let c=0;c<ch.grid[0].length;c++,i++){
    if (ch.grid[r][c]!==0){ need++; if (flat[i]===ch.grid[r][c]) have++; }
  }
  return need>0 && have>=need;
}

/* ----- loading a character ---------------------------------------------- */
function loadCharacter(ch){
  CHAR = ch;
  ROWS = ch.grid.length; COLS = ch.grid[0].length;
  filled = ch.grid.map(row => row.map(()=>0));
  pop    = ch.grid.map(row => row.map(()=>0));
  shake  = ch.grid.map(row => row.map(()=>0));
  paintableTotal = 0; paintedCount = 0;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (ch.grid[r][c]!==0) paintableTotal++;

  // restore any saved painting (only accept correct fills)
  const flat = loadSaved(ch);
  if (flat){
    let i=0;
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++,i++){
      if (ch.grid[r][c]!==0 && flat[i]===ch.grid[r][c]){ filled[r][c]=flat[i]; paintedCount++; }
    }
  }
  won = paintedCount >= paintableTotal && paintableTotal>0;

  zoom = 1; panTarget = null; glyphs = null;      // always open on the whole picture
  buildPalette();
  refreshSwatches();
  selectColor(firstIncomplete());
  resize();
  updateZoomBtn();
  updateProgress();
}

/* ----- palette ----------------------------------------------------------- */
function buildPalette(){
  paletteEl.innerHTML = '';
  swatches = {};
  numbers = Object.keys(CHAR.palette).map(Number).sort((a,b)=>a-b);
  numbers.forEach(num => {
    const info = CHAR.palette[num];
    const btn = document.createElement('button');
    btn.className = 'swatch';
    btn.innerHTML =
      `<span class="chip" style="background:${info.hex};color:${textOn(info.hex)}">${num}</span>` +
      `<span class="done">✓</span>`;
    btn.addEventListener('pointerdown', e => { e.preventDefault(); selectColor(num); });
    paletteEl.appendChild(btn);
    swatches[num] = btn;
  });
}
function selectColor(num){
  selected = num;
  numbers.forEach(n => swatches[n].classList.toggle('sel', n === num));
  blip(660, 0.05, 'select');
  // zoomed in with none of this colour on screen? glide to the nearest bit of it
  if (zoom > 1.05 && vw && !hasVisibleRemaining(num)) centerOnRemaining(num, false);
}
function remainingFor(num){
  let n=0;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++)
    if (CHAR.grid[r][c]===num && filled[r][c]===0) n++;
  return n;
}
function refreshSwatches(){
  numbers.forEach(n => swatches[n].classList.toggle('complete', remainingFor(n)===0));
}
function firstIncomplete(){
  for (const n of numbers) if (remainingFor(n) > 0) return n;
  return numbers[0];
}

/* ----- layout / sizing --------------------------------------------------- */
function resize(){
  confetti.width = window.innerWidth;
  confetti.height = window.innerHeight;
  if (!CHAR) return;
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const size = Math.max(80, Math.floor(Math.min(rect.width, rect.height) - 4));
  vw = COLS >= ROWS ? size : Math.round(size * COLS / ROWS);
  vh = ROWS >= COLS ? size : Math.round(size * ROWS / COLS);
  board.style.width = vw + 'px';
  board.style.height = vh + 'px';
  board.width = Math.floor(vw * dpr);
  board.height = Math.floor(vh * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  fitCell = vw / COLS;
  cell = fitCell * zoom;
  glyphs = null;
  clampPan();
}
window.addEventListener('resize', resize);

/* keep the picture inside the window: centred while it fits, edge-locked once zoomed */
function clampPan(){
  const w = cell*COLS, h = cell*ROWS;
  ox = w <= vw ? (vw-w)/2 : Math.min(0, Math.max(vw-w, ox));
  oy = h <= vh ? (vh-h)/2 : Math.min(0, Math.max(vh-h, oy));
}
function setZoom(z, ax, ay){                      // ax,ay = viewport point to hold still
  z = Math.max(1, Math.min(ZOOM_MAX, z));
  if (ax === undefined){ ax = vw/2; ay = vh/2; }
  const gx = (ax-ox)/cell, gy = (ay-oy)/cell;     // grid coords under the anchor
  zoom = z; cell = fitCell*zoom; glyphs = null; panTarget = null;
  ox = ax - gx*cell; oy = ay - gy*cell;
  clampPan();
}
function panTo(x, y, instant){
  const sx=ox, sy=oy;
  ox = x; oy = y; clampPan();
  const tx=ox, ty=oy;
  if (instant) return;
  ox = sx; oy = sy; panTarget = {x:tx, y:ty};
}
function visibleRange(){
  return {
    r0: Math.max(0, Math.floor(-oy/cell)),        r1: Math.min(ROWS-1, Math.ceil((vh-oy)/cell)),
    c0: Math.max(0, Math.floor(-ox/cell)),        c1: Math.min(COLS-1, Math.ceil((vw-ox)/cell)),
  };
}
function hasVisibleRemaining(num){
  const v = visibleRange();
  for (let r=v.r0;r<=v.r1;r++) for (let c=v.c0;c<=v.c1;c++)
    if (CHAR.grid[r][c]===num && filled[r][c]===0) return true;
  return false;
}
// slide the window to the nearest unpainted cell of a colour, so nobody gets stranded
function centerOnRemaining(num, instant){
  const ccx = (vw/2-ox)/cell, ccy = (vh/2-oy)/cell;
  let best=null, bd=Infinity;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    if (CHAR.grid[r][c]!==num || filled[r][c]!==0) continue;
    const dx=c+0.5-ccx, dy=r+0.5-ccy, d=dx*dx+dy*dy;
    if (d<bd){ bd=d; best=[r,c]; }
  }
  if (best) panTo(vw/2-(best[1]+0.5)*cell, vh/2-(best[0]+0.5)*cell, instant);
}
function cycleZoom(){
  let i = ZOOM_STEPS.findIndex(s => Math.abs(s-zoom) < 0.05);
  i = (i < 0 ? 0 : i+1) % ZOOM_STEPS.length;
  setZoom(ZOOM_STEPS[i]);
  if (ZOOM_STEPS[i] > 1) centerOnRemaining(selected, true);
  updateZoomBtn();
}
function updateZoomBtn(){
  const b = document.getElementById('zoomBtn');
  b.textContent = zoom > 1.05 ? '🔎' : '🔍';
  b.title = zoom > 1.05 ? `Zoom ${zoom.toFixed(1)}× — tap to change` : 'Zoom in';
}

/* numbers are drawn thousands of times a frame on a 72x72 grid, so each digit is
   pre-rendered once per zoom level and blitted instead of laid out as text */
let glyphs = null;
function glyph(num, target){
  const s = Math.max(1, Math.round(cell));
  if (!glyphs || glyphs.s !== s) glyphs = {s, on:{}, off:{}};
  const bank = target ? glyphs.on : glyphs.off;
  if (!bank[num]){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cv = document.createElement('canvas');
    cv.width = cv.height = Math.max(1, Math.round(s*dpr));
    const g = cv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle = target ? CHAR.palette[num].hex : '#c8bcd6';
    g.font = `${target?800:600} ${Math.floor(s*0.55)}px "Baloo 2",system-ui,sans-serif`;
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(String(num), s/2, s/2+1);
    bank[num] = cv;
  }
  return bank[num];
}

/* ----- draw the board (runs every frame) -------------------------------- */
function draw(t){
  requestAnimationFrame(draw);
  if (!CHAR){ return; }

  if (panTarget){                                  // eased auto-pan to the next bit of work
    ox += (panTarget.x-ox)*0.18; oy += (panTarget.y-oy)*0.18;
    if (Math.abs(panTarget.x-ox) < 0.5 && Math.abs(panTarget.y-oy) < 0.5){
      ox = panTarget.x; oy = panTarget.y; panTarget = null;
    }
  }

  ctx.fillStyle = CHAR.bg;
  ctx.fillRect(0,0,vw,vh);
  const highlight = 0.5 + 0.5*Math.sin(t/220);     // pulse for the selected colour
  const showNums = cell >= 12;                     // hide tiny numbers when zoomed out
  const showGrid = cell >= 6;
  const v = visibleRange();                        // only touch cells actually on screen

  ctx.strokeStyle = 'rgba(110,90,121,0.10)';
  ctx.lineWidth = 1;

  for (let r=v.r0;r<=v.r1;r++){
    for (let c=v.c0;c<=v.c1;c++){
      const val = CHAR.grid[r][c];
      // integer edges shared with the neighbouring cell: no seams at fractional zoom
      let x = Math.round(ox + c*cell),     y = Math.round(oy + r*cell);
      const w = Math.round(ox + (c+1)*cell) - x, h = Math.round(oy + (r+1)*cell) - y;

      if (shake[r][c] > 0){                        // gentle wiggle on a wrong tap
        const k = shake[r][c]/280;
        x += Math.sin(t/28) * 3 * k;
        shake[r][c] = Math.max(0, shake[r][c] - 16);
      }

      if (val === 0) continue;                     // background — already filled above

      if (won){                                    // clean reveal — no numbers/grid
        ctx.fillStyle = CHAR.palette[filled[r][c] || val].hex;
        ctx.fillRect(x,y,w,h);
        continue;
      }

      if (filled[r][c] !== 0){
        ctx.fillStyle = CHAR.palette[filled[r][c]].hex;
        if (pop[r][c] > 0){
          const s = 1 + 0.18*(pop[r][c]/220);
          pop[r][c] = Math.max(0, pop[r][c]-16);
          ctx.save();
          ctx.translate(x+w/2, y+h/2); ctx.scale(s,s);
          ctx.fillRect(-w/2,-h/2,w,h);
          ctx.restore();
        } else {
          ctx.fillRect(x,y,w,h);
        }
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x,y,w,h);
        const isTarget = val === selected;
        if (isTarget){
          ctx.fillStyle = CHAR.palette[val].hex;
          ctx.globalAlpha = 0.22 + 0.18*highlight;
          ctx.fillRect(x,y,w,h);
          ctx.globalAlpha = 1;
        }
        if (showNums) ctx.drawImage(glyph(val, isTarget), x, y, w, h);
      }

      if (showGrid) ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
    }
  }
}

/* ----- painting ---------------------------------------------------------- */
let painting=false, lastShake=0, lastRC=null, combo=0, lastFill=0;
function cellAt(clientX, clientY){
  const rect = board.getBoundingClientRect();
  const c = Math.floor((clientX - rect.left - ox) / cell);
  const r = Math.floor((clientY - rect.top  - oy) / cell);
  if (r<0||c<0||r>=ROWS||c>=COLS) return null;
  return [r,c];
}
function fillCell(r,c){
  if (won || selected===0) return;
  if (r<0||c<0||r>=ROWS||c>=COLS) return;
  const val = CHAR.grid[r][c];
  if (val===0 || filled[r][c]!==0) return;
  if (val === selected){
    filled[r][c] = selected;
    pop[r][c] = 220;
    paintedCount++;
    const now = performance.now();                 // a run of quick fills climbs in pitch
    combo = (now - lastFill < 420) ? Math.min(combo+1, 10) : 0;
    lastFill = now;
    blip(520 + combo*26 + Math.random()*20, 0.06, 'tap');
    updateProgress();
    if (remainingFor(selected)===0){
      refreshSwatches(); sparkle();
      if (paintedCount < paintableTotal) selectColor(firstIncomplete());
    }
    if (paintedCount >= paintableTotal) winGame();
  } else {
    shake[r][c] = 280;
    const now = performance.now();
    if (now - lastShake > 180){ blip(300, 0.05, 'nope'); lastShake = now; }
  }
}
function strokeTo(clientX, clientY){            // fill along the stroke, no skips
  const at = cellAt(clientX, clientY);
  if (!at) return;
  if (lastRC){
    const [r0,c0]=lastRC, [r1,c1]=at;
    const steps = Math.max(Math.abs(r1-r0), Math.abs(c1-c0)) || 1;
    for (let i=0;i<=steps;i++) fillCell(Math.round(r0+(r1-r0)*i/steps), Math.round(c0+(c1-c0)*i/steps));
  } else fillCell(at[0], at[1]);
  lastRC = at;
}
/* one finger paints; two fingers pinch to zoom and drag to move the picture */
const pointers = new Map();
let pinch = null;
function pinchNow(){
  const [a,b] = [...pointers.values()];
  const r = board.getBoundingClientRect();
  return { d: Math.hypot(a.x-b.x, a.y-b.y), mx: (a.x+b.x)/2 - r.left, my: (a.y+b.y)/2 - r.top };
}
function doPinch(){
  const p = pinchNow();
  if (!pinch){ pinch = p; return; }
  ox += p.mx - pinch.mx; oy += p.my - pinch.my;                 // drag
  if (pinch.d > 8){                                            // spread / squeeze
    const z = Math.max(1, Math.min(ZOOM_MAX, zoom * (p.d/pinch.d)));
    const gx = (p.mx-ox)/cell, gy = (p.my-oy)/cell;
    zoom = z; cell = fitCell*zoom; glyphs = null;
    ox = p.mx - gx*cell; oy = p.my - gy*cell;
  }
  clampPan(); updateZoomBtn();
  pinch = p;
}
board.addEventListener('pointerdown', e => {
  e.preventDefault();
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  try { board.setPointerCapture(e.pointerId); } catch(_){}
  if (pointers.size >= 2){ painting = false; lastRC = null; pinch = null; return; }
  if (won) return;
  painting = true; lastRC = null; panTarget = null;
  strokeTo(e.clientX, e.clientY);
});
board.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  e.preventDefault();
  if (pointers.size >= 2){ doPinch(); return; }
  if (painting) strokeTo(e.clientX, e.clientY);
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0 && painting){ painting = false; lastRC = null; saveProgress(); }
}
board.addEventListener('pointerup', endPointer);
board.addEventListener('pointercancel', endPointer);
board.addEventListener('wheel', e => {
  e.preventDefault();
  const r = board.getBoundingClientRect();
  setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1/1.15), e.clientX-r.left, e.clientY-r.top);
  updateZoomBtn();
}, {passive:false});
board.addEventListener('contextmenu', e => e.preventDefault());

function updateProgress(){
  const pct = paintableTotal ? Math.round(paintedCount / paintableTotal * 100) : 0;
  progressFill.style.width = pct + '%';
  progressPct.textContent = pct + '%';
}

/* ----- sound (all generated, no files) ----------------------------------
   iOS suspends the AudioContext whenever the app is backgrounded, and it only
   resumes inside a user gesture. initAudio() is therefore called from every
   gesture (and on return to the foreground) so the click never goes missing. */
let audio = null, master = null, voices = 0, lastVoice = 0;
function initAudio(){
  if (!audio){
    try {
      audio = new (window.AudioContext||window.webkitAudioContext)();
      master = audio.createGain(); master.gain.value = 1; master.connect(audio.destination);
      const s = audio.createBufferSource();                 // silent buffer unlocks iOS output
      s.buffer = audio.createBuffer(1,1,22050); s.connect(master); s.start(0);
    } catch(e){ audio = null; return; }
  }
  if (audio.state !== 'running') audio.resume().catch(()=>{});
}
function blip(freq, dur, kind){
  if (!soundOn || !freq) return;
  initAudio();                                    // heals a context suspended in the background
  if (!audio || audio.state !== 'running') return;
  const now = audio.currentTime;
  if (voices >= 10 || now - lastVoice < 0.022) return;   // a fast drag must not spawn 100 oscillators
  lastVoice = now;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = kind === 'tap' ? 'triangle' : 'sine';
  o.frequency.value = freq;
  g.gain.value = 0.0001;
  o.connect(g); g.connect(master);
  g.gain.exponentialRampToValueAtTime(kind==='tap'?0.18:0.12, now+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
  o.start(now); o.stop(now+dur+0.02);
  voices++; o.onended = () => { voices = Math.max(0, voices-1); };
}
// any tap anywhere counts as the gesture that unlocks/resumes audio
document.addEventListener('pointerdown', initAudio, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) initAudio(); });
function sparkle(){ if (soundOn&&audio) [880,1175,1568].forEach((f,i)=> setTimeout(()=>blip(f,0.12,'tap'), i*70)); }
function chime(){ if (soundOn&&audio) [523,659,784,1047,1319].forEach((f,i)=> setTimeout(()=>blip(f,0.35,'tap'), i*130)); }

/* ----- confetti ---------------------------------------------------------- */
let parts = [];
const CONFETTI_COLORS = ['#f5a9c7','#a8e6cf','#ffe29a','#ee7ba6','#b9a4e0','#8fd3f4'];
function burstConfetti(){
  parts = [];
  const count = Math.min(420, Math.max(140, Math.round(confetti.width/8)));
  for (let i=0;i<count;i++){
    parts.push({
      x: Math.random()*confetti.width,
      y: Math.random()*confetti.height*0.85 - confetti.height*0.15,  // start already on-screen
      vx:(Math.random()-0.5)*2, vy:2+Math.random()*3.5,
      s:6+Math.random()*8, rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
      col:CONFETTI_COLORS[i % CONFETTI_COLORS.length], life:1,
    });
  }
  runConfetti();
}
function runConfetti(){
  cctx.clearRect(0,0,confetti.width,confetti.height);
  let alive = 0;
  for (const p of parts){
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.rot+=p.vr;
    if (p.y > confetti.height + 20) p.life = 0;
    if (p.life > 0){ alive++;
      cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot);
      cctx.fillStyle = p.col; cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cctx.restore();
    }
  }
  if (alive > 0) requestAnimationFrame(runConfetti);
  else cctx.clearRect(0,0,confetti.width,confetti.height);
}

/* ----- win / reset ------------------------------------------------------- */
function winGame(){
  won = true;
  saveProgress();
  updateProgress();
  chime();
  burstConfetti();
  document.getElementById('winMsg').textContent = `Your ${CHAR.name.toLowerCase()} looks wonderful!`;
  setTimeout(()=> document.getElementById('win').classList.add('show'), 700);
}
function resetGame(){
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){ filled[r][c]=0; pop[r][c]=0; shake[r][c]=0; }
  paintedCount = 0; won = false;
  clearSaved();
  updateProgress();
  refreshSwatches();
  selectColor(numbers[0]);
}

/* ----- character gallery ------------------------------------------------- */
function buildGallery(){
  galleryGrid.innerHTML = '';
  CHARACTERS.forEach(ch => {
    const R=ch.grid.length, C=ch.grid[0].length, cs=Math.floor(80/Math.max(R,C))+1;
    const btn = document.createElement('button');
    btn.className = 'pick' + (isComplete(ch) ? ' done' : '');
    const cv = document.createElement('canvas'); cv.width=C*cs; cv.height=R*cs;
    const g = cv.getContext('2d');
    for (let r=0;r<R;r++) for (let c=0;c<C;c++){
      const v = ch.grid[r][c];
      g.fillStyle = v===0 ? ch.bg : ch.palette[v].hex;
      g.fillRect(c*cs, r*cs, cs, cs);
    }
    btn.appendChild(cv);
    const lab = document.createElement('div'); lab.className='plabel'; lab.textContent = ch.name;
    btn.appendChild(lab);
    const star = document.createElement('div'); star.className='star'; star.textContent='⭐';
    btn.appendChild(star);
    btn.addEventListener('pointerdown', e => { e.preventDefault(); chooseCharacter(ch); });
    galleryGrid.appendChild(btn);
  });
}
function showGallery(){
  if (CHAR) saveProgress();
  buildGallery();
  galleryEl.classList.add('show');
}
function chooseCharacter(ch){
  initAudio();
  if (audio && audio.state === 'suspended') audio.resume();
  galleryEl.classList.remove('show');
  document.getElementById('win').classList.remove('show');
  loadCharacter(ch);
  if (won){                       // already finished: offer a fresh start, so it never feels "broken"
    document.getElementById('winMsg').textContent = `You already painted this ${CHAR.name.toLowerCase()} — paint it again?`;
    document.getElementById('win').classList.add('show');
  }
}

/* ----- buttons ----------------------------------------------------------- */
document.getElementById('homeBtn').addEventListener('pointerdown', e => { e.preventDefault(); showGallery(); });
document.getElementById('zoomBtn').addEventListener('pointerdown', e => { e.preventDefault(); if (CHAR) cycleZoom(); });
document.getElementById('soundBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
});
document.getElementById('resetBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); if (CHAR) document.getElementById('confirm').classList.add('show');
});
document.getElementById('confirmYes').addEventListener('pointerdown', e => {
  e.preventDefault(); document.getElementById('confirm').classList.remove('show'); resetGame();
});
document.getElementById('confirmNo').addEventListener('pointerdown', e => {
  e.preventDefault(); document.getElementById('confirm').classList.remove('show');
});
document.getElementById('againBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); document.getElementById('win').classList.remove('show'); resetGame();
});
document.getElementById('pickBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); document.getElementById('win').classList.remove('show'); showGallery();
});
/* ----- support (grown-ups-only parental gate before the donate page) ----- */
let gateAnswer = 0;
function newQuestion(){
  const a = 3 + Math.floor(Math.random()*7);   // 3..9
  const b = 6 + Math.floor(Math.random()*4);   // 6..9  (product 18..81 — easy for adults)
  gateAnswer = a*b;
  document.getElementById('gateQ').textContent = `${a} × ${b} = ?`;
  const inp = document.getElementById('gateInput');
  inp.value = ''; setTimeout(()=> inp.focus(), 60);
}
function openGate(){
  document.getElementById('gateErr').textContent = '';
  newQuestion();
  document.getElementById('gate').classList.add('show');
}
function closeGate(){ document.getElementById('gate').classList.remove('show'); }
document.getElementById('supportBtn').addEventListener('pointerdown', e => { e.preventDefault(); openGate(); });
document.getElementById('gateCancel').addEventListener('pointerdown', e => { e.preventDefault(); closeGate(); });
document.getElementById('gateOk').addEventListener('pointerdown', e => {
  e.preventDefault();
  const val = parseInt(document.getElementById('gateInput').value, 10);
  if (val === gateAnswer){ closeGate(); window.open(SUPPORT_URL, '_blank', 'noopener'); }
  else { document.getElementById('gateErr').textContent = 'Not quite — ask a grown-up to try again.'; newQuestion(); }
});
document.getElementById('gateInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('gateOk').dispatchEvent(new Event('pointerdown')); });

window.addEventListener('pagehide', saveProgress);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });

/* ----- go ---------------------------------------------------------------- */
resize();
buildGallery();
requestAnimationFrame(draw);

/* offline support (ignored under file://; works on https / installed app) */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
